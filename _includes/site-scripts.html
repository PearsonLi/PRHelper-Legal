<script>
(function () {
  var KEY = 'cr_site_lang';
  var zhPreferred = (navigator.language || '').toLowerCase().indexOf('zh') === 0;
  var saved = localStorage.getItem(KEY);
  var lang = saved === 'zh' || saved === 'en' ? saved : (zhPreferred ? 'zh' : 'en');
  var ATTRIBUTION_KEY = 'cr_session_attribution';
  var FIRST_TOUCH_KEY = 'cr_first_touch_attribution';

  function safeStorage(storage, operation, key, value) {
    try {
      if (operation === 'get') return storage.getItem(key);
      storage.setItem(key, value);
    } catch (e) {}
    return null;
  }

  function referrerHost() {
    if (!document.referrer) return '(direct)';
    try {
      return new URL(document.referrer).hostname || '(direct)';
    } catch (e) {
      return '(unknown)';
    }
  }

  function readAttribution() {
    var existing = safeStorage(sessionStorage, 'get', ATTRIBUTION_KEY);
    if (existing) {
      try { return JSON.parse(existing); } catch (e) {}
    }

    var query = new URLSearchParams(window.location.search);
    var source = query.get('utm_source') || referrerHost();
    var medium = query.get('utm_medium') || (source === '(direct)' ? '(none)' : 'referral');
    var attribution = {
      traffic_source: source,
      traffic_medium: medium,
      traffic_campaign: query.get('utm_campaign') || '(not set)',
      traffic_content: query.get('utm_content') || '(not set)',
      traffic_term: query.get('utm_term') || '(not set)',
      referrer_host: referrerHost(),
      landing_path: window.location.pathname,
      page_language: document.documentElement.lang || lang
    };
    safeStorage(sessionStorage, 'set', ATTRIBUTION_KEY, JSON.stringify(attribution));
    if (!safeStorage(localStorage, 'get', FIRST_TOUCH_KEY)) {
      safeStorage(localStorage, 'set', FIRST_TOUCH_KEY, JSON.stringify(attribution));
    }
    return attribution;
  }

  var attribution = readAttribution();

  function track(eventName, params) {
    try {
      if (typeof window.gtag === 'function') {
        var payload = Object.assign({}, attribution, params || {});
        window.gtag('event', eventName, payload);
      }
    } catch (e) {}
  }

  function oldPathToLangPath(pathname, targetLang) {
    var map = {
      '/PRHelper-Legal/': {
        zh: '/PRHelper-Legal/zh/',
        en: '/PRHelper-Legal/en/'
      },
      '/PRHelper-Legal/features/': {
        zh: '/PRHelper-Legal/zh/features/',
        en: '/PRHelper-Legal/en/features/'
      },
      '/PRHelper-Legal/pricing/': {
        zh: '/PRHelper-Legal/zh/pricing/',
        en: '/PRHelper-Legal/en/pricing/'
      },
      '/PRHelper-Legal/faq/': {
        zh: '/PRHelper-Legal/zh/faq/',
        en: '/PRHelper-Legal/en/faq/'
      },
      '/PRHelper-Legal/support/': {
        zh: '/PRHelper-Legal/zh/support/',
        en: '/PRHelper-Legal/en/support/'
      },
      '/PRHelper-Legal/marketing/': {
        zh: '/PRHelper-Legal/zh/marketing/',
        en: '/PRHelper-Legal/en/marketing/'
      },
      '/PRHelper-Legal/terms/': {
        zh: '/PRHelper-Legal/terms/zh/',
        en: '/PRHelper-Legal/terms/en/'
      },
      '/PRHelper-Legal/privacy/': {
        zh: '/PRHelper-Legal/privacy/zh/',
        en: '/PRHelper-Legal/privacy/en/'
      },
      '/PRHelper-Legal/topics/': {
        zh: '/PRHelper-Legal/zh/topics/',
        en: '/PRHelper-Legal/en/topics/'
      },
      '/PRHelper-Legal/topics/pr-730-rule/': {
        zh: '/PRHelper-Legal/zh/topics/pr-730-rule/',
        en: '/PRHelper-Legal/en/topics/pr-730-rule/'
      },
      '/PRHelper-Legal/topics/pr-card-renewal-checklist/': {
        zh: '/PRHelper-Legal/zh/topics/pr-card-renewal-checklist/',
        en: '/PRHelper-Legal/en/topics/pr-card-renewal-checklist/'
      },
      '/PRHelper-Legal/topics/citizenship-1095-rule/': {
        zh: '/PRHelper-Legal/zh/topics/citizenship-1095-rule/',
        en: '/PRHelper-Legal/en/topics/citizenship-1095-rule/'
      },
      '/PRHelper-Legal/topics/pre-pr-credit/': {
        zh: '/PRHelper-Legal/zh/topics/pre-pr-credit/',
        en: '/PRHelper-Legal/en/topics/pre-pr-credit/'
      },
      '/PRHelper-Legal/topics/travel-planning-impact/': {
        zh: '/PRHelper-Legal/zh/topics/travel-planning-impact/',
        en: '/PRHelper-Legal/en/topics/travel-planning-impact/'
      },
      '/PRHelper-Legal/topics/family-multi-member-guide/': {
        zh: '/PRHelper-Legal/zh/topics/family-multi-member-guide/',
        en: '/PRHelper-Legal/en/topics/family-multi-member-guide/'
      },
      '/PRHelper-Legal/topics/missing-travel-dates/': {
        zh: '/PRHelper-Legal/zh/topics/missing-travel-dates/',
        en: '/PRHelper-Legal/en/topics/missing-travel-dates/'
      },
      '/PRHelper-Legal/topics/frequent-border-trips/': {
        zh: '/PRHelper-Legal/zh/topics/frequent-border-trips/',
        en: '/PRHelper-Legal/en/topics/frequent-border-trips/'
      }
    };
    if (map[pathname] && map[pathname][targetLang]) {
      return map[pathname][targetLang];
    }
    return null;
  }

  function counterpartUrl(pathname, targetLang) {
    var m;

    m = pathname.match(/^\/PRHelper-Legal\/(zh|en)\/(.*)$/);
    if (m) {
      return '/PRHelper-Legal/' + targetLang + '/' + m[2];
    }

    m = pathname.match(/^(\/PRHelper-Legal\/terms\/)en(\/(?:v[0-9\-]+\/?)?)?$/);
    if (m && targetLang === 'zh') return m[1] + 'zh' + (m[2] || '/');
    m = pathname.match(/^(\/PRHelper-Legal\/terms\/)zh(\/(?:v[0-9\-]+\/?)?)?$/);
    if (m && targetLang === 'en') return m[1] + 'en' + (m[2] || '/');

    m = pathname.match(/^(\/PRHelper-Legal\/privacy\/)en(\/(?:v[0-9\-]+\/?)?)?$/);
    if (m && targetLang === 'zh') return m[1] + 'zh' + (m[2] || '/');
    m = pathname.match(/^(\/PRHelper-Legal\/privacy\/)zh(\/(?:v[0-9\-]+\/?)?)?$/);
    if (m && targetLang === 'en') return m[1] + 'en' + (m[2] || '/');

    return oldPathToLangPath(pathname, targetLang);
  }

  function applyLang(nextLang) {
    document.documentElement.setAttribute('data-lang', nextLang);
    document.documentElement.lang = nextLang === 'zh' ? 'zh-CN' : 'en';
    var buttons = document.querySelectorAll('[data-lang-target]');
    buttons.forEach(function (btn) {
      var active = btn.getAttribute('data-lang-target') === nextLang;
      btn.setAttribute('aria-pressed', active ? 'true' : 'false');
      btn.classList.toggle('is-active', active);
    });
  }

  applyLang(lang);

  if (!safeStorage(sessionStorage, 'get', 'cr_session_start_sent')) {
    track('site_session_start', {
      page_path: window.location.pathname,
      page_title: document.title
    });
    safeStorage(sessionStorage, 'set', 'cr_session_start_sent', '1');
  }

  document.addEventListener('click', function (event) {
    var target = event.target;
    if (!target) return;

    var btn = target.closest('[data-lang-target]');
    if (btn) {
      event.preventDefault();
      var nextLang = btn.getAttribute('data-lang-target');
      if (nextLang !== 'zh' && nextLang !== 'en') return;
      localStorage.setItem(KEY, nextLang);
      track('language_switch', { language_to: nextLang });

      var currentPath = window.location.pathname;
      var redirect = counterpartUrl(currentPath, nextLang);
      if (redirect && redirect !== currentPath) {
        window.location.href = redirect;
        return;
      }
      applyLang(nextLang);
      return;
    }

    var link = target.closest('a');
    if (!link) return;
    var linkText = (link.textContent || '').replace(/\s+/g, ' ').trim().slice(0, 100);
    var allLinks = Array.prototype.slice.call(document.querySelectorAll('a'));
    var linkPosition = allLinks.indexOf(link) + 1;
    var linkUrl = link.href || link.getAttribute('href') || '';
    var funnelAction = link.getAttribute('data-funnel-action');

    if (funnelAction) {
      track('funnel_action', {
        funnel_stage: link.getAttribute('data-funnel-stage') || '(not set)',
        funnel_action: funnelAction,
        funnel_experiment: link.getAttribute('data-funnel-experiment') || '(not set)',
        link_text: linkText,
        link_url: linkUrl,
        source_path: window.location.pathname
      });
    }

    if (link.classList.contains('btn')) {
      track('cta_click', {
        cta_text: linkText,
        link_url: linkUrl,
        link_position: linkPosition,
        source_path: window.location.pathname
      });
    }

    if (link.classList.contains('guide-card')) {
      track('guide_open', {
        guide_url: linkUrl,
        guide_title: linkText,
        link_position: linkPosition,
        source_path: window.location.pathname
      });
    }

    var isAppStore = link.classList.contains('app-store-badge-link') ||
      link.classList.contains('app-store-qr-link') ||
      (linkUrl && linkUrl.indexOf('apps.apple.com') !== -1);

    if (isAppStore) {
      track('app_store_click', {
        link_text: linkText,
        link_url: linkUrl,
        link_position: linkPosition,
        source_path: window.location.pathname,
        page_title: document.title
      });
      return;
    }

    if (linkUrl && /^https?:/i.test(linkUrl)) {
      try {
        if (new URL(linkUrl).hostname !== window.location.hostname) {
          track('outbound_link_click', {
            link_text: linkText,
            link_url: linkUrl,
            link_domain: new URL(linkUrl).hostname,
            link_position: linkPosition,
            source_path: window.location.pathname
          });
        }
      } catch (e) {}
    }
  });

  document.addEventListener('toggle', function (event) {
    var details = event.target;
    if (!details || details.tagName !== 'DETAILS') return;
    if (!details.classList.contains('faq-item')) return;
    if (!details.open) return;
    var label = details.getAttribute('data-faq-id') || 'unknown';
    track('faq_expand', { faq_id: label, page_path: window.location.pathname });
  }, true);
})();
</script>
