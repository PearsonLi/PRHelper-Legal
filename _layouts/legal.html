<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ page.title }} | {{ site.title }}</title>
    <meta name="description" content="{{ site.description }}" />
    <link rel="stylesheet" href="{{ '/assets/legal.css' | relative_url }}" />
  </head>
  <body>
    <main class="shell">
      <header class="hero card">
        <div class="badge">🍁 {{ site.title }}</div>
        <h1 class="hero-title">{{ page.hero_title | default: page.title }}</h1>
        {% if page.hero_subtitle %}
        <p class="hero-subtitle">{{ page.hero_subtitle }}</p>
        {% endif %}
        <div class="nav-links">
          <a href="{{ '/' | relative_url }}">Home</a>
          <a href="{{ '/terms/' | relative_url }}">Terms</a>
          <a href="{{ '/privacy/' | relative_url }}">Privacy</a>
          <a href="{{ '/support/' | relative_url }}">Support</a>
          <a href="{{ '/marketing/' | relative_url }}">Marketing</a>
        </div>
      </header>

      <article class="card content-card">
        {% if page.last_updated %}
        <p class="meta">Last Updated / 最后更新：{{ page.last_updated }}</p>
        {% endif %}
        {{ content }}
      </article>
    </main>
  </body>
</html>
