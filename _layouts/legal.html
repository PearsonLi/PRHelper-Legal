<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ page.title }} | {{ site.title }}</title>
    <meta name="description" content="{{ site.description }}" />
    <link rel="stylesheet" href="{{ '/assets/legal.css' | relative_url }}" />
  </head>
  <body>
    <main class="shell">
      <header class="hero card">
        <h1 class="hero-title">{{ page.hero_title | default: page.title }}</h1>
        {% if page.hero_subtitle %}
        <p class="hero-subtitle">{{ page.hero_subtitle }}</p>
        {% endif %}
        <nav class="menu-links" aria-label="Legal navigation">
          <a class="menu-link {% if page.nav_key == 'terms' %}active{% endif %}" href="{{ '/terms/' | relative_url }}">Terms of Use</a>
          <a class="menu-link {% if page.nav_key == 'privacy' %}active{% endif %}" href="{{ '/privacy/' | relative_url }}">Privacy Policy</a>
          <a class="menu-link {% if page.nav_key == 'support' %}active{% endif %}" href="{{ '/support/' | relative_url }}">Support</a>
          <a class="menu-link {% if page.nav_key == 'marketing' %}active{% endif %}" href="{{ '/marketing/' | relative_url }}">Marketing</a>
        </nav>
      </header>

      <article class="card content-card">
        {% if page.last_updated %}
        <p class="meta">Last Updated / 最后更新：{{ page.last_updated }}</p>
        {% endif %}
        {{ content }}
      </article>
    </main>
  </body>
</html>
