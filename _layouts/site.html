<!doctype html>
<html lang="{{ page.lang | default: site.lang | default: 'zh-CN' }}">
  <head>
    <meta charset="utf-8" />
    {% include seo-head.html %}
    <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}" />
  </head>
  <body class="site-page">
    {% include site-header.html %}

    <main class="site-main">
      <article class="content-shell">
        {{ content }}
      </article>
    </main>

    <aside class="mobile-trip-cta" data-mobile-trip-cta aria-label="CanResidency free trip test">
      <button type="button" class="mobile-trip-cta-close" data-mobile-trip-cta-close aria-label="Dismiss">×</button>
      <span class="lang-zh"><strong>先免费核实一段行程</strong><small>最多10条旅行记录</small></span>
      <span class="lang-en"><strong>Verify one trip free</strong><small>Up to 10 trip records</small></span>
      <a data-funnel-stage="download" data-funnel-action="mobile_sticky_start_one_trip" data-funnel-experiment="mobile_sticky_v1" href="https://apps.apple.com/app/id6759813402" target="_blank" rel="noopener noreferrer"><span class="lang-zh">打开 App Store</span><span class="lang-en">Open App Store</span></a>
    </aside>

    {% include site-footer.html %}
    {% include site-scripts.html %}
  </body>
</html>
